<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020b18">
<title>MC City Planner ISO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== TOP BAR ===== -->
  <div id="topbar">
    <div id="topbar-btns">
      <span class="title">⬡ MC CITY ISO</span>
      <button class="tb-btn" id="btn-undo">↩<span id="lbl-undo">戻す</span></button>
      <button class="tb-btn" id="btn-redo">↪<span id="lbl-redo">進む</span></button>
      <button class="tb-btn" id="btn-zi">＋</button>
      <button class="tb-btn" id="btn-zo">－</button>
      <button class="tb-btn" id="btn-center"><span id="lbl-center">⌖中心</span></button>
      <button class="tb-btn" id="btn-settings">⚙<span id="lbl-settings">設定</span></button>
    </div>
  </div>

  <!-- ===== MAIN AREA ===== -->
  <div id="main-area">
    <div id="canvas-wrap">
      <canvas id="gc"></canvas>
      <canvas id="ov"></canvas>
    </div>

    <!-- ===== SETTINGS PANEL ===== -->
    <div id="settings-backdrop"></div>
    <div id="settings-panel">
      <button id="settings-x" onclick="closeSettings()">✕</button>
      <div class="settings-title">⚙ SETTINGS</div>

      <!-- 夜間モード（最上部） -->
      <div class="settings-row">
        <div>
          <div class="settings-row-label" id="lbl-s-night">🌙 夜間モード</div>
          <div class="settings-row-desc" id="desc-s-night">夜景・照明エフェクト</div>
        </div>
        <button id="settings-night" class="toggle-btn">OFF</button>
      </div>

      <div class="settings-divider"></div>

      <!-- 配置音 -->
      <div class="settings-row">
        <div>
          <div class="settings-row-label" id="lbl-s-sound">🔊 配置音</div>
          <div class="settings-row-desc" id="desc-s-sound">ブロック配置時の効果音</div>
        </div>
        <button id="settings-sound" class="toggle-btn on">ON</button>
      </div>

      <!-- バイブ -->
      <div class="settings-row">
        <div>
          <div class="settings-row-label" id="lbl-s-vibe">📳 バイブ</div>
          <div class="settings-row-desc" id="desc-s-vibe">タップ時の振動フィードバック</div>
        </div>
        <button id="settings-vibe" class="toggle-btn on">ON</button>
      </div>

      <!-- グリッド -->
      <div class="settings-row">
        <div>
          <div class="settings-row-label" id="lbl-s-grid">⊞ グリッド</div>
          <div class="settings-row-desc" id="desc-s-grid">グリッド線の表示</div>
        </div>
        <button id="settings-grid" class="toggle-btn on">ON</button>
      </div>

      <!-- 背景色 ★追加 -->
      <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px;">
        <div>
          <div class="settings-row-label" id="lbl-s-bg">🎨 背景色</div>
          <div class="settings-row-desc" id="desc-s-bg">マップの地面・空の色</div>
        </div>
        <div class="bg-swatches">
          <button class="bg-swatch active" data-bg="default" id="bg-default" title="デフォルト"></button>
          <button class="bg-swatch"        data-bg="grass"   id="bg-grass"   title="グリーン"></button>
          <button class="bg-swatch"        data-bg="desert"  id="bg-desert"  title="サンド"></button>
          <button class="bg-swatch"        data-bg="snow"    id="bg-snow"    title="スノー"></button>
          <button class="bg-swatch"        data-bg="ocean"   id="bg-ocean"   title="オーシャン"></button>
          <button class="bg-swatch"        data-bg="stone"   id="bg-stone"   title="ストーン"></button>
        </div>
      </div>

      <!-- 言語 -->
      <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px;">
        <div>
          <div class="settings-row-label" id="lbl-s-lang">🌐 言語</div>
          <div class="settings-row-desc" id="desc-s-lang">表示言語を選択</div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">
          <button class="lang-btn active" data-lang="ja">🇯🇵JA</button>
          <button class="lang-btn" data-lang="en">🇺🇸EN</button>
          <button class="lang-btn" data-lang="zh">🇨🇳ZH</button>
          <button class="lang-btn" data-lang="ko">🇰🇷KO</button>
          <button class="lang-btn" data-lang="es">🇪🇸ES</button>
          <button class="lang-btn" data-lang="fr">🇫🇷FR</button>
          <button class="lang-btn" data-lang="id">🇮🇩ID</button>
          <button class="lang-btn" data-lang="hi">🇮🇳HI</button>
        </div>
      </div>

      <div class="settings-divider"></div>

      <!-- セーブ -->
      <div id="field-save-area" style="margin-bottom:8px;">
        <input id="field-name-input" type="text" placeholder="マップ名..." maxlength="30"
          style="width:100%;padding:9px 10px;border-radius:8px;box-sizing:border-box;
                 background:rgba(255,255,255,.06);border:1.5px solid var(--border);
                 color:#fff;font-size:15px;font-family:'Noto Sans JP',sans-serif;
                 outline:none;margin-bottom:6px;display:block;">
        <button id="settings-save" class="settings-action primary">💾 保存</button>
      </div>
      <div id="field-slot-list"></div>

      <button id="settings-clear" class="settings-action danger">🗑 マップをクリア</button>
      <button id="settings-close" class="settings-close">閉じる</button>
    </div>

    <!-- ===== BLOCK SHEET ===== -->
    <div id="sheet-backdrop"></div>
    <div id="sheet">
      <div id="sheet-handle"></div>
      <div id="sheet-tabs"></div>
      <div id="sheet-body">
        <div class="block-grid" id="block-grid"></div>
      </div>
    </div>
  </div>

  <!-- ===== BOTTOM BAR ===== -->
  <div id="bottom-bar">

    <!-- 左：選択中ブロック表示（クリック不可・ボタン風なし） -->
    <div id="sel-preview">
      <div id="sel-icon">🏠</div>
      <div id="sel-label">家</div>
    </div>

    <!-- 中央3ボタン（従来グラデ＋SVGイラストアイコン） -->
    <button class="bb-btn active" id="tool-draw">
      <svg width="17" height="17" viewBox="-11 -14 22 22" style="overflow:visible;display:block;">
        <g transform="rotate(-42)">
          <rect x="-3" y="-10" width="6" height="13" rx="1.5" fill="#3b9eff"/>
          <polygon points="-3,3 3,3 0,9" fill="#c8e8ff"/>
          <rect x="-3" y="-13" width="6" height="4" rx="1" fill="#f0a0a0"/>
          <rect x="-1.5" y="-6" width="3" height="8" fill="#5ab8ff" opacity="0.3"/>
        </g>
      </svg>
      <span class="bb-lbl" id="lbl-draw">描く</span>
    </button>

    <button class="bb-btn" id="tool-erase">
      <svg width="19" height="16" viewBox="-13 -10 26 18" style="display:block;">
        <rect x="-11" y="-8" width="22" height="13" rx="3" fill="#3b9eff" opacity="0.85"/>
        <rect x="-11" y="-8" width="9"  height="13" rx="3" fill="#5bc8ff"/>
        <line x1="-2" y1="-8" x2="-2" y2="5" stroke="#071828" stroke-width="1" opacity="0.4"/>
        <line x1="1" y1="7" x2="10" y2="7" stroke="#c0d8f0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <span class="bb-lbl" id="lbl-erase">消す</span>
    </button>

    <button class="bb-btn" id="tool-fill">
      <svg width="19" height="19" viewBox="-10 -16 26 22" style="display:block;">
        <path d="M-5,-6 Q-5,-13 0,-13 Q5,-13 5,-6" fill="none" stroke="#5ab8ff" stroke-width="2" stroke-linecap="round"/>
        <path d="M-7,-1 L-8,8 L8,8 L7,-1 Z" fill="#3b9eff"/>
        <ellipse cx="0" cy="-1" rx="7" ry="2.5" fill="#5ab8ff"/>
        <circle cx="11" cy="4" r="4" fill="#f5c842"/>
        <ellipse cx="11" cy="9" rx="2.5" ry="1.5" fill="#f5c842" opacity="0.4"/>
      </svg>
      <span class="bb-lbl" id="lbl-fill">塗り</span>
    </button>

    <!-- 右：一覧ボタン（円・右端から飛び出す） はapp直下に配置 -->

  </div>

</div><!-- /#app -->

<!-- ===== 一覧ボタン（#appの外・固定位置） ===== -->
<button id="parts-btn">
  <svg width="26" height="26" viewBox="-17 -17 34 34" style="display:block;">
    <rect x="-15" y="-15" width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="-4"  y="-15" width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="7"   y="-15" width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="-15" y="-4"  width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="-4"  y="-4"  width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="7"   y="-4"  width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="-15" y="7"   width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="-4"  y="7"   width="8" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="7"   y="7"   width="8" height="8" rx="1.5" fill="#ffffff"/>
  </svg>
  <span id="lbl-list">一覧</span>
</button>

<!-- ===== CONTEXT MENU ===== -->
<div id="ctx-menu">
  <div class="ctx-title" id="ctx-title">向き</div>
  <div class="ctx-dir-grid">
    <div></div>
    <button class="ctx-dir-btn" data-dir="N">↑</button>
    <div></div>
    <button class="ctx-dir-btn" data-dir="W">←</button>
    <button class="ctx-dir-btn center-btn" data-dir="none" id="ctx-auto">自動</button>
    <button class="ctx-dir-btn" data-dir="E">→</button>
    <div></div>
    <button class="ctx-dir-btn" data-dir="S">↓</button>
    <div></div>
  </div>
  <div class="ctx-sep"></div>
  <button class="ctx-action danger" id="ctx-delete">🗑 削除</button>
  <button id="ctx-close">閉じる</button>
</div>

<!-- JS: load order matters -->
<script>
// ブラウザ全体のピンチズーム・ダブルタップズームを禁止
// （canvas-wrap内のタッチはinteraction.jsが処理するため除外）
document.addEventListener('gesturestart',  function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gestureend',    function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', function(e){
  if(e.touches.length > 1){
    var wrap = document.getElementById('canvas-wrap');
    if(wrap && wrap.contains(e.target)) return; // canvas内はOK
    e.preventDefault(); // それ以外（バー等）は禁止
  }
}, {passive:false});
// ダブルタップズーム禁止
var lastTap = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if(now - lastTap < 300){
    var wrap = document.getElementById('canvas-wrap');
    if(!(wrap && wrap.contains(e.target))) e.preventDefault();
  }
  lastTap = now;
}, {passive:false});
</script>
<script src="js/constants.js"></script>
<script src="js/iso-engine.js"></script>
<script src="js/nature-draw.js"></script>
<script src="js/roads-draw.js"></script>
<script src="js/blocks-draw.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/interaction.js"></script>
<script src="js/main.js"></script>
</body>
</html>
